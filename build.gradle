buildscript {
    repositories {
        mavenCentral()
        google()
        gradlePluginPortal()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.0'
        classpath "org.gretty:gretty:3.1.0"
    }
}

allprojects {
    apply plugin: 'eclipse'
    apply plugin: 'idea'

    ext {
        appName = '星际塔防'
        gdxVersion = '1.12.1'
    }

    repositories {
        mavenCentral()
        google()
    }
}
